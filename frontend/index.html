<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teja LangGraph Agent — plan, research, draft, critique, final</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
  header { background: linear-gradient(90deg, #2563eb, #f97316); padding: 20px; }
  header h1 { margin: 0; font-size: 1.4rem; }
  header p { margin: 4px 0 0; opacity: .9; font-size: .9rem; }
  main { max-width: 820px; margin: 0 auto; padding: 20px; }
  #status { font-size: .85rem; color: #94a3b8; margin-bottom: 12px; }
  form { display: flex; gap: 8px; margin-top: 12px; }
  input[type=text] { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #fff; }
  button { padding: 12px 18px; border-radius: 10px; border: none; background: #f97316; color: #fff; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { background: #1e293b; border: 1px solid #334155; color: #e2e8f0; padding: 6px 10px; border-radius: 999px; font-size: .8rem; cursor: pointer; }
  section { margin-top: 20px; }
  h2 { font-size: 1rem; color: #93c5fd; margin-bottom: 8px; }
  .card { background: #1e293b; border-radius: 12px; padding: 14px; line-height: 1.5; }
  .card ul { margin: 6px 0; padding-left: 20px; }
  .log { display: flex; flex-direction: column; gap: 8px; }
  .step { background: #1e293b; border-left: 4px solid #2563eb; border-radius: 8px; padding: 10px 12px; }
  .step b { color: #93c5fd; text-transform: capitalize; }
  .step .tools { font-size: .8rem; color: #94a3b8; margin-top: 4px; }
  .meta { font-size: .85rem; color: #94a3b8; }
  .final { background: #1e293b; border: 1px solid #f97316; border-radius: 12px; padding: 14px; line-height: 1.6; white-space: pre-wrap; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>Teja LangGraph Agent</h1>
  <p>Give it a task — it plans, researches with tools, drafts, critiques itself, and returns a structured answer with citations.</p>
</header>
<main>
  <div id="status">Loading…</div>
  <form id="form">
    <input type="text" id="task" placeholder="e.g. Summarize Teja's AI experience for an AI Engineer role" autocomplete="off">
    <button id="send" type="submit">Run agent</button>
  </form>
  <div class="chips" id="chips"></div>

  <section id="planSec" class="hidden"><h2>1 · Plan</h2><div class="card" id="plan"></div></section>
  <section id="logSec" class="hidden"><h2>2 · Run log — every graph step</h2><div class="log" id="log"></div></section>
  <section id="toolsSec" class="hidden"><h2>3 · Tool calls</h2><div class="card" id="tools"></div></section>
  <section id="finalSec" class="hidden"><h2>4 · Final structured answer</h2>
    <div class="final" id="final"></div>
    <p class="meta" id="finalMeta"></p>
  </section>
</main>
<script>
const statusEl = document.getElementById('status');
const form = document.getElementById('form');
const taskInput = document.getElementById('task');
const sendBtn = document.getElementById('send');

async function loadStatus() {
  try {
    const h = await (await fetch('/health')).json();
    statusEl.textContent = `Mode: ${h.mode} (mock = no API key, runs offline) · Graph: ${h.graph}`;
    const t = await (await fetch('/tasks')).json();
    const chips = document.getElementById('chips');
    t.tasks.forEach(task => {
      const c = document.createElement('button');
      c.className = 'chip'; c.type = 'button'; c.textContent = task;
      c.onclick = () => { taskInput.value = task; form.requestSubmit(); };
      chips.appendChild(c);
    });
  } catch (e) { statusEl.textContent = 'Backend not reachable — is it running on port 8001?'; }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const task = taskInput.value.trim();
  if (!task) return;
  sendBtn.disabled = true; sendBtn.textContent = 'Running…';
  ['planSec','logSec','toolsSec','finalSec'].forEach(id => document.getElementById(id).classList.add('hidden'));
  try {
    const res = await fetch('/run', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({task}) });
    const data = await res.json();
    document.getElementById('plan').innerHTML = '<ol>' + data.plan.map(p => `<li>${p}</li>`).join('') + '</ol>';
    document.getElementById('log').innerHTML = data.log.map(s => {
      const tools = (s.tool_calls || []).map(t => `${t.tool}("${t.query.slice(0,40)}…") → ${t.result_count} result(s): ${t.sources.join(', ')}`).join('<br>');
      return `<div class="step"><b>${s.node}</b> — ${s.detail}${tools ? `<div class="tools">${tools}</div>` : ''}</div>`;
    }).join('');
    document.getElementById('tools').innerHTML = data.tool_calls.map(t =>
      `<p><strong>${t.tool}</strong> — query: “${t.query}” → ${t.result_count} result(s) from ${t.sources.join(', ') || 'none'}</p>`).join('');
    const f = data.final;
    document.getElementById('final').textContent =
      f.summary + '\n\nKey points:\n' + f.key_points.map(p => '• ' + p).join('\n') +
      '\n\nCitations: ' + f.citations.join(', ') +
      '\n\nLimitations: ' + f.limitations;
    document.getElementById('finalMeta').textContent =
      `Confidence: ${f.confidence} · Mode: ${f.mode} · Revisions after self-critique: ${data.revisions} · Critique: ${data.critique}`;
    ['planSec','logSec','toolsSec','finalSec'].forEach(id => document.getElementById(id).classList.remove('hidden'));
  } catch (err) {
    statusEl.textContent = 'Error running the agent: ' + err;
  }
  sendBtn.disabled = false; sendBtn.textContent = 'Run agent';
});
loadStatus();
</script>
</body>
</html>
