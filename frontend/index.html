<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teja LangGraph Agent — plan, research, draft, critique, final</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; background: #f0fdfa; color: #134e4a; }
  header { background: #0f766e; color: #fff; padding: 22px 20px; }
  header h1 { margin: 0; font-size: 1.5rem; }
  header p { margin: 6px 0 0; opacity: .92; font-size: .92rem; }
  main { max-width: 880px; margin: 0 auto; padding: 20px; }
  #status { font-size: .85rem; color: #0f766e; background: #ccfbf1; border: 1px solid #5eead4; border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
  form { display: flex; gap: 8px; margin-top: 12px; }
  input[type=text] { flex: 1; padding: 13px; border-radius: 10px; border: 1px solid #99f6e4; background: #fff; color: #134e4a; font-size: 1rem; }
  input[type=text]:focus { outline: 2px solid #0d9488; }
  button { padding: 13px 20px; border-radius: 10px; border: none; background: #0d9488; color: #fff; font-weight: 700; cursor: pointer; }
  button:hover { background: #0f766e; }
  button:disabled { opacity: .5; cursor: wait; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { background: #fff; border: 1px solid #5eead4; color: #0f766e; padding: 7px 12px; border-radius: 999px; font-size: .82rem; cursor: pointer; }
  .chip:hover { background: #ccfbf1; }
  .pipeline { display: flex; gap: 0; margin: 22px 0 4px; }
  .pstep { flex: 1; text-align: center; background: #fff; border: 2px solid #14b8a6; color: #0f766e; padding: 12px 4px 10px; font-weight: 700; font-size: .82rem; position: relative; }
  .pstep:first-child { border-radius: 12px 0 0 12px; }
  .pstep:last-child { border-radius: 0 12px 12px 0; background: #0d9488; color: #fff; border-color: #0d9488; }
  .pstep + .pstep { border-left: none; }
  .pstep .num { display: block; font-size: 1.25rem; line-height: 1.1; }
  .pstep .arr { position: absolute; right: -11px; top: 50%; transform: translateY(-50%); z-index: 1; color: #0d9488; font-size: 1.1rem; }
  .pstep:last-child .arr { display: none; }
  section { margin-top: 22px; }
  h2 { font-size: 1rem; color: #0f766e; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .04em; }
  .card { background: #fff; border: 1px solid #99f6e4; border-radius: 12px; padding: 14px; line-height: 1.55; }
  .card ul { margin: 6px 0; padding-left: 20px; }
  .log { display: flex; flex-direction: column; gap: 8px; background: #134e4a; border-radius: 12px; padding: 14px; }
  .step { background: #f0fdfa; border-left: 4px solid #14b8a6; border-radius: 8px; padding: 10px 12px; color: #134e4a; }
  .step b { color: #0f766e; text-transform: capitalize; }
  .step .tools { font-size: .8rem; color: #115e59; margin-top: 4px; }
  .meta { font-size: .85rem; color: #0f766e; }
  .final { background: #ecfdf5; border: 2px solid #10b981; border-radius: 12px; padding: 16px; line-height: 1.6; white-space: pre-wrap; color: #064e3b; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>Krishnateja LangGraph Agent</h1>
  <p>Give it a task — it plans, researches with tools, drafts, critiques itself, and returns a structured answer with citations.</p>
</header>
<main>
  <div id="status">Loading…</div>
  <form id="form">
    <input type="text" id="task" placeholder="e.g. Summarize Teja's AI experience for an AI Engineer role" autocomplete="off">
    <button id="send" type="submit">Run agent</button>
  </form>
  <div class="chips" id="chips"></div>
  <div class="pipeline" aria-label="Agent pipeline">
    <div class="pstep"><span class="num">1</span>Plan<span class="arr">&#9656;</span></div>
    <div class="pstep"><span class="num">2</span>Research<span class="arr">&#9656;</span></div>
    <div class="pstep"><span class="num">3</span>Draft<span class="arr">&#9656;</span></div>
    <div class="pstep"><span class="num">4</span>Critique<span class="arr">&#9656;</span></div>
    <div class="pstep"><span class="num">5</span>Finalize</div>
  </div>

  <section id="planSec" class="hidden"><h2>1 · Plan</h2><div class="card" id="plan"></div></section>
  <section id="logSec" class="hidden"><h2>2 · Run log — every graph step</h2><div class="log" id="log"></div></section>
  <section id="toolsSec" class="hidden"><h2>3 · Tool calls</h2><div class="card" id="tools"></div></section>
  <section id="finalSec" class="hidden"><h2>4 · Final structured answer</h2>
    <div class="final" id="final"></div>
    <p class="meta" id="finalMeta"></p>
  </section>
</main>
<script>
const statusEl = document.getElementById('status');
const form = document.getElementById('form');
const taskInput = document.getElementById('task');
const sendBtn = document.getElementById('send');

async function loadStatus() {
  try {
    const h = await (await fetch('/health')).json();
    statusEl.textContent = `Mode: ${h.mode} (mock = no API key, runs offline) · Graph: ${h.graph}`;
    const t = await (await fetch('/tasks')).json();
    const chips = document.getElementById('chips');
    t.tasks.forEach(task => {
      const c = document.createElement('button');
      c.className = 'chip'; c.type = 'button'; c.textContent = task;
      c.onclick = () => { taskInput.value = task; form.requestSubmit(); };
      chips.appendChild(c);
    });
  } catch (e) { statusEl.textContent = 'Backend not reachable — is it running on port 8001?'; }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const task = taskInput.value.trim();
  if (!task) return;
  sendBtn.disabled = true; sendBtn.textContent = 'Running…';
  ['planSec','logSec','toolsSec','finalSec'].forEach(id => document.getElementById(id).classList.add('hidden'));
  try {
    const res = await fetch('/run', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({task}) });
    const data = await res.json();
    document.getElementById('plan').innerHTML = '<ol>' + data.plan.map(p => `<li>${p}</li>`).join('') + '</ol>';
    document.getElementById('log').innerHTML = data.log.map(s => {
      const tools = (s.tool_calls || []).map(t => `${t.tool}("${t.query.slice(0,40)}…") → ${t.result_count} result(s): ${t.sources.join(', ')}`).join('<br>');
      return `<div class="step"><b>${s.node}</b> — ${s.detail}${tools ? `<div class="tools">${tools}</div>` : ''}</div>`;
    }).join('');
    document.getElementById('tools').innerHTML = data.tool_calls.map(t =>
      `<p><strong>${t.tool}</strong> — query: “${t.query}” → ${t.result_count} result(s) from ${t.sources.join(', ') || 'none'}</p>`).join('');
    const f = data.final;
    document.getElementById('final').textContent =
      f.summary + '\n\nKey points:\n' + f.key_points.map(p => '• ' + p).join('\n') +
      '\n\nCitations: ' + f.citations.join(', ') +
      '\n\nLimitations: ' + f.limitations;
    document.getElementById('finalMeta').textContent =
      `Confidence: ${f.confidence} · Mode: ${f.mode} · Revisions after self-critique: ${data.revisions} · Critique: ${data.critique}`;
    ['planSec','logSec','toolsSec','finalSec'].forEach(id => document.getElementById(id).classList.remove('hidden'));
  } catch (err) {
    statusEl.textContent = 'Error running the agent: ' + err;
  }
  sendBtn.disabled = false; sendBtn.textContent = 'Run agent';
});
loadStatus();
</script>
</body>
</html>
